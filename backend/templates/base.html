<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Beheer{% endblock %} · Interstellar Travel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
  <header class="top">
    <div class="logo"><span class="mark"></span>INTERSTELLAR <b>TRAVEL</b> <em>beheer</em></div>
    {% if session.get('admin') %}
    <nav>
      <a href="{{ url_for('admin_panel') }}">Paneel</a>
      <a href="{{ url_for('admin_database') }}">Database</a>
      <a href="{{ url_for('admin_logout') }}">Uitloggen</a>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
