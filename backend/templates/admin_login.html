{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<div class="center">
  <form class="card narrow" method="post" action="{{ url_for('admin_login') }}">
    <p class="eyebrow">Beheer · alleen voor administrators</p>
    <h1>Admin login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>Gebruikersnaam
      <input type="text" name="username" autocomplete="off" required autofocus>
    </label>
    <label>Wachtwoord
      <input type="password" name="password" autocomplete="off" required>
    </label>
    <button type="submit" class="btn">Inloggen</button>
    <a class="back" href="/">← Terug naar de planeet</a>
  </form>
</div>
{% endblock %}
